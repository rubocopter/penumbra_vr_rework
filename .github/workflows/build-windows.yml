name: Build Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Validate project
        shell: pwsh
        run: ./scripts/check-project.ps1

      - name: Build and package
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PenumbraVR-Windows-Win32
          path: build/package/Release/PenumbraVR
          if-no-files-found: error
