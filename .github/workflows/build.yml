name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Release Win32
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Validate project and build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Package release layout
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenumbraVR-${{ github.ref_name }}
          path: build/package/Release/PenumbraVR/
          if-no-files-found: error
